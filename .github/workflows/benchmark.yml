name: 10K benchmark

on:
  workflow_dispatch:
  push:
    paths:
      - 'backend/app/simulation/**'
      - 'backend/scripts/run_benchmark.py'
      - 'backend/requirements.txt'

jobs:
  benchmark:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: PYTHONPATH=. python scripts/run_benchmark.py
        env:
          BENCHMARK_SIZE: 10000
          BENCHMARK_SEED: 42
          BENCHMARK_OUTPUT: benchmark-result.json
      - uses: actions/upload-artifact@v4
        with:
          name: recoverai-10k-benchmark
          path: backend/benchmark-result.json
