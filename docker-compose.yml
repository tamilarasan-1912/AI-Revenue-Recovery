version: '3.8'
services:
  db:
    image: postgres:15-alpine
    environment: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: recoverai }
    ports: ['5432:5432']
  backend:
    build: ./backend
    ports: ['8000:8000']
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/recoverai
      - LLM_PROVIDER=mock
    depends_on: [db]
  frontend:
    build: ./frontend
    ports: ['3000:3000']
    depends_on: [backend]
