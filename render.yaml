services:
  - type: web
    name: recoverai-api
    runtime: docker
    plan: free
    region: singapore
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/system/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: recoverai-db
          property: connectionString
      - key: LLM_PROVIDER
        value: deterministic
      - key: ENABLE_RAZORPAY_TEST_ACTIONS
        value: "false"
      - key: ALLOW_SQLITE_FALLBACK
        value: "false"
      - key: REQUIRE_WEBHOOK_SIGNATURE
        value: "true"
      - key: WEBHOOK_MAX_AGE_SECONDS
        value: "300"
      - key: CORS_ORIGINS
        value: "*"

  - type: web
    name: recoverai-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://recoverai-api-zwr9.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: recoverai-db
    plan: free
    region: singapore
    databaseName: recoverai
    user: recoverai
